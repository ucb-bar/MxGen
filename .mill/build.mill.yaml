extends: ScalaModule
scalaVersion: 2.13.12
repositories:
  - https://repo1.maven.org/maven2
  - https://oss.sonatype.org/content/repositories/releases
  - https://oss.sonatype.org/content/repositories/snapshots
mvnDeps:
  - org.chipsalliance::chisel:6.6.0
scalacPluginMvnDeps:
  - org.chipsalliance:chisel-plugin_2.13.12:6.6.0
scalacOptions:
  - -deprecation
  - -feature
  - -unchecked
  - -language:reflectiveCalls
mainClass: mxgen.Main
# Sources live at <mxgen>/src/main/scala so sbt (which only walks
# <mxgen>/src/main/scala) sees them directly. mill workspace lives in
# this .mill/ subdir so sbt's HiddenFileFilter skips out/, test/, etc.
sources:
  - ../src/main/scala
  - elab
resources:
  - ../src/main/resources
